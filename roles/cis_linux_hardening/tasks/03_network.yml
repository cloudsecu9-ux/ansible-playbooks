---
- name: "[CIS 3.1] IP Forwarding(패킷 포워딩) 설정 점검"
  ansible.builtin.sysctl:
    name: net.ipv4.ip_forward
  register: ip_forward_check
  ignore_errors: yes

- name: "[CIS 3.1] IP Forwarding 결과 수집"
  ansible.builtin.set_fact:
    cis_report_list: "{{ cis_report_list + [{
      'id': 'CIS-3.1.1',
      'category': 'Network',
      'title': 'IP Forwarding 비활성화 점검 (0 지정)',
      'status': (ip_forward_check.value | default('1') == '0') | ternary('PASS', 'FAIL')
    }] }}"
